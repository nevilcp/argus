[project]
name = "argus"
version = "2.0.0"
description = "Multi-agent financial intelligence system orchestrating specialist LLMs and statistical models for quantitative equity research."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "nevilcp" }]
requires-python = ">=3.11"
classifiers = [
    "Private :: Do Not Upload",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]
dependencies = [
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langchain-core>=0.3.0",
    "langchain-groq>=1.1.2",
    "groq>=0.37.1",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.5.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pandas>=2.2.0",
    "pandas-ta-openbb>=0.4.24",
    "numpy>=1.26.0",
    "scipy>=1.14.0",
    "scikit-learn>=1.5.0",
    "hmmlearn>=0.3.2",
    "yfinance>=1.3.0",
    "fredapi>=0.5.2",
    "chromadb>=1.5.9",
    "newsapi-python>=0.2.7",
    "pytrends>=4.9.2",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.11.0",
    "requests>=2.32.0",
]

[project.urls]
Repository = "https://github.com/nevilcp/argus"

[project.scripts]
argus-collect = "scripts.collect_session:main"
argus-reconcile = "scripts.reconcile_outcomes:main"
argus-replay = "scripts.replay_backtest:main"
argus-evaluate = "scripts.run_evaluation:main"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["argus", "api", "scripts"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "hypothesis>=6.100.0",
    # Linter and type-checker are pinned exactly, not floored. With `ruff>=0.7.0`
    # the enforced rule set was whatever the installed version happened to default
    # to: 0.15 defaults to E4/E7/E9/F, 0.16 defaults to a much larger set, so the
    # same commit passed locally and failed in CI with 232 findings. Pin the tool,
    # and declare the rule set explicitly under [tool.ruff.lint] below.
    "ruff==0.16.2",
    "mypy==2.3.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "pytest-asyncio>=0.24.0",
    "hypothesis>=6.100.0",
]
# FinBERT (sentiment.py) and the cultural-memory embedding function
# (memory/cultural.py) both lazy-import from this extra on first actual use,
# not on module import. CI and a bare local install don't need it; the
# Docker image does (see Dockerfile.api) since /analyze needs both live.
models = [
    "sentence-transformers>=2.7.0",
    "transformers>=4.46.0",
    "torch>=2.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Stated explicitly rather than inherited from whatever the installed ruff
# version defaults to. This is the set that was actually enforced across the
# rebuild (ruff 0.15's defaults): pyflakes plus the pycodestyle error subset.
# Ruff 0.16 would additionally flag ~230 findings, mostly DTZ (naive
# `datetime.now()`) and UP (PEP 604/585 annotations). Those are real and worth
# fixing — DTZ especially, in a system whose outcome resolution is date-keyed —
# but adopting them is a code change, not a CI fix, so it is tracked separately
# rather than smuggled in here.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
