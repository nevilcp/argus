[project]
name = "argus"
version = "2.0.0"
description = """\
Multi-agent financial intelligence system orchestrating specialist LLMs and statistical models \
for quantitative equity research."""
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "nevilcp" }]
requires-python = ">=3.14"
classifiers = [
    "Private :: Do Not Upload",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langchain-core>=0.3.0",
    "langchain-groq>=1.1.2",
    "groq>=0.37.1",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.5.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pandas>=2.2.0",
    "pandas-ta-openbb>=0.4.24",
    "numpy>=1.26.0",
    "scipy>=1.14.0",
    # Pin artifact libraries; changing their major.minor versions requires retraining and committing the HMM artifact.
    "scikit-learn==1.8.0",
    "hmmlearn==0.3.3",
    "joblib==1.5.3",
    "yfinance>=1.3.0",
    "fredapi>=0.5.2",
    "chromadb>=1.5.9",
    "newsapi-python>=0.2.7",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
]

[project.urls]
Repository = "https://github.com/nevilcp/argus"

[project.scripts]
argus-collect = "scripts.collect_session:main"
argus-reconcile = "scripts.reconcile_outcomes:main"
argus-replay = "scripts.replay_backtest:main"
argus-evaluate = "scripts.run_evaluation:main"
argus-train-macro = "scripts.train_macro_hmm:main"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["argus", "api", "scripts"]

[project.optional-dependencies]
dev = [
    "argus[test]",
    # Pin development tools and select rules explicitly so local checks and CI agree.
    "ruff==0.16.2",
    "mypy==2.3.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "hypothesis>=6.100.0",
]
# Load optional local models only when used; fixture-backed tests do not need the models extra.
models = [
    "sentence-transformers>=2.7.0",
    "transformers>=4.46.0",
    "torch>=2.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live_network: hits live Yahoo Finance/FRED endpoints; skipped when they are unreachable",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
# Enforce correctness, style, documentation, and complexity rules consistently across the repository.
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF", "PT", "DTZ", "PERF", "PLR0915", "D", "W505", "ERA001"]
ignore = ["D1", "D203", "D213", "D417"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 120

[tool.ruff.lint.pylint]
# Bound implementation complexity while allowing helpers for coherent substeps.
max-statements = 43

[tool.ruff.lint.per-file-ignores]
# Fixtures use the same naive local persisted timestamps as production; production suppressions remain per-call.
"tests/*" = ["DTZ"]
# Preserve prompt text as application data; review comments and docstrings separately against the 120-character limit.
"argus/agents/fundamental.py" = ["E501"]
"argus/agents/sentiment.py" = ["E501"]
"argus/agents/portfolio.py" = ["E501"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
