[project]
name = "argus"
version = "2.0.0"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langchain-core>=0.3.0",
    "langchain-groq>=0.2.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.5.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pandas>=2.2.0",
    "pandas-ta-openbb>=0.4.24",
    "numpy>=1.26.0",
    "scipy>=1.14.0",
    "scikit-learn>=1.5.0",
    "hmmlearn>=0.3.2",
    "yfinance>=0.2.45",
    "fredapi>=0.5.2",
    "chromadb>=0.5.0",
    "newsapi-python>=0.2.7",
    "pytrends>=4.9.2",
    "backtrader>=1.9.78",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.11.0",
    "requests>=2.32.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["argus"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "hypothesis>=6.100.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "pytest-asyncio>=0.24.0",
    "hypothesis>=6.100.0",
]
# FinBERT (sentiment.py) and the cultural-memory embedding function
# (memory/cultural.py) both lazy-import from this extra on first actual use,
# not on module import — see ADR 0007. Default install and CI never need it.
models = [
    "sentence-transformers>=2.7.0",
    "transformers>=4.46.0",
    "torch>=2.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
# backtesting/{engine,walk_forward,phase1_calibration,phase2_validation,bias_auditor,pit_enforcer}.py
# are deleted in PR 7 (ADR: "why ARGUS cannot be backtested over multi-year windows") — not worth
# typing precisely for a module about to go away. metrics.py is kept and stays in scope.
exclude = [
    "argus/backtesting/engine.py",
    "argus/backtesting/walk_forward.py",
    "argus/backtesting/phase1_calibration.py",
    "argus/backtesting/phase2_validation.py",
    "argus/backtesting/bias_auditor.py",
    "argus/backtesting/pit_enforcer.py",
]
