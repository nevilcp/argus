[project]
name = "argus"
version = "2.0.0"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langchain-core>=0.3.0",
    "langchain-groq>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.5.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "streamlit>=1.40.0",
    "pandas>=2.2.0",
    "pandas-ta-openbb>=0.4.24",
    "numpy>=1.26.0",
    "scipy>=1.14.0",
    "scikit-learn>=1.5.0",
    "hmmlearn>=0.3.2",
    "yfinance>=0.2.45",
    "fredapi>=0.5.2",
    "chromadb>=0.5.0",
    "sentence-transformers>=2.7.0",
    "transformers>=4.46.0",
    "torch>=2.4.0",
    "newsapi-python>=0.2.7",
    "pytrends>=4.9.2",
    "backtrader>=1.9.78",
    "plotly>=5.24.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.11.0",
    "requests>=2.32.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["argus"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
