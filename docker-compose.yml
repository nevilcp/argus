services:
  argus-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Use env_file for secrets and Compose defaults for loops; mount each store in its own volume.
      - ARGUS_COLLECTOR_ENABLED=${ARGUS_COLLECTOR_ENABLED:-true}
      - ARGUS_RECONCILE_ENABLED=${ARGUS_RECONCILE_ENABLED:-true}
      - ARGUS_CHROMA_DIR=/app/chroma_db
      - ARGUS_RUNS_DIR=/app/runs
    volumes:
      - argus-data:/app/data
      - chroma-db:/app/chroma_db
      - runs:/app/runs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Allow startup time for baked model loading and the first indicator-ready candle sweep.
      start_period: 90s

volumes:
  argus-data:
  chroma-db:
  runs:
