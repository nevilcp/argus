services:
  argus-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Secrets (GROQ_API_KEY, FRED_API_KEY, NEWSAPI_KEY) come through via
      # env_file above; ARGUS_COLLECTOR_ENABLED/ARGUS_RECONCILE_ENABLED need
      # compose-level default-value substitution, which env_file alone can't
      # provide. ARGUS_CHROMA_DIR/ARGUS_RUNS_DIR point at their own named
      # volumes below rather than nesting under ARGUS_DATA_DIR.
      - ARGUS_COLLECTOR_ENABLED=${ARGUS_COLLECTOR_ENABLED:-true}
      - ARGUS_RECONCILE_ENABLED=${ARGUS_RECONCILE_ENABLED:-true}
      - ARGUS_CHROMA_DIR=/app/chroma_db
      - ARGUS_RUNS_DIR=/app/runs
    volumes:
      - argus-data:/app/data
      - chroma-db:/app/chroma_db
      - runs:/app/runs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      # FinBERT and the embedding model are baked into the image; the macro
      # agent now just loads a committed artifact (see argus/agents/macro.py),
      # so this headroom is really for MFT pipeline warmup on first boot
      start_period: 90s

volumes:
  argus-data:
  chroma-db:
  runs:
