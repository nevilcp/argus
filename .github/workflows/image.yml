name: Build and publish image

on:
  push:
    branches: ["main"]
    paths:
      - "Dockerfile.api"
      - "pyproject.toml"
      - "README.md"
      - "LICENSE"
      - "argus/**"
      - "api/**"
      - "scripts/**"
      - ".github/workflows/image.yml"
  schedule:
    # Weekly rebuild so base-image and dependency security patches land even
    # without a code push
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
