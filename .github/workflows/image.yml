name: Build and publish image

on:
  push:
    branches: ["main"]
    paths:
      - "Dockerfile.api"
      - "pyproject.toml"
      - "README.md"
      - "LICENSE"
      - "argus/**"
      - "api/**"
      - "scripts/**"
      - ".github/workflows/image.yml"
  schedule:
    # Weekly rebuild so base-image and dependency security patches land even
    # without a code push
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute immutable tag
        id: vars
        run: echo "tag=sha-${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.tag }}
          build-args: |
            ARGUS_IMAGE_TAG=${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pin scheduled jobs to this build
        # collector.yml/reconcile.yml read this back to decide which
        # immutable tag to pull (see their "Read pinned image tag" step)
        # instead of chasing :latest — GITHUB_TOKEN can't write repository
        # variables (needs a PAT), so this reuses the same orphan-branch,
        # force-pushed-single-commit idiom the publish-argus-state action
        # already uses for argus-data, on its own argus-deploy branch. Rolling back
        # is a one-line edit to image-tag.txt on that branch, pushed by hand
        # — no rebuild required.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/argus-deploy
          echo "${{ steps.vars.outputs.tag }}" > /tmp/argus-deploy/image-tag.txt
          cd /tmp/argus-deploy
          git init -q -b argus-deploy
          git config user.name "argus-image-publisher"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Pin scheduled jobs to ${{ steps.vars.outputs.tag }}"
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
            argus-deploy:argus-deploy
