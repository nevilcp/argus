name: Daily reconciliation

# The other half of the decision -> outcome loop: resolves decisions past
# their horizon against live prices and writes outcomes back to cultural
# memory, so reliability weighting has real evidence to learn from. Runs
# once daily, well after US market close.

on:
  schedule:
    - cron: "30 22 * * 1-5" # 22:30 UTC — after the last hourly collector tick
  workflow_dispatch:

concurrency:
  group: argus-collector # shares the argus-data branch with collector.yml; never run both at once
  cancel-in-progress: false

permissions:
  contents: write
  packages: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore prior state
        uses: ./.github/actions/restore-argus-state

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run reconciliation
        run: |
          docker run --rm \
            -v "$PWD/data:/app/data" \
            "ghcr.io/${{ github.repository }}:latest" \
            argus-reconcile --decisions-log data/decisions.jsonl

      - name: Compute status update
        id: status
        run: |
          json="$(jq -nc --arg t "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{last_reconcile: $t}')"
          echo "json=$json" >> "$GITHUB_OUTPUT"

      - name: Publish updated state
        uses: ./.github/actions/publish-argus-state
        with:
          status-update: ${{ steps.status.outputs.json }}
          commit-message: "Reconcile outcomes"
          github-token: ${{ secrets.GITHUB_TOKEN }}
