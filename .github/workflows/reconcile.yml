name: Daily reconciliation

# Settle matured decisions after market close so reliability weighting can use observed returns.

on:
  schedule:
    - cron: "30 22 * * 1-5" # 22:30 UTC - after the last two-hourly collector tick
  workflow_dispatch:

concurrency:
  group: argus-collector # shares the argus-data branch with collector.yml; never run both at once
  cancel-in-progress: false

permissions:
  contents: write
  packages: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    # Allow larger settlement batches while bounding a stalled reconciliation run.
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Restore prior state
        uses: ./.github/actions/restore-argus-state

      - name: Load pinned image
        id: image
        uses: ./.github/actions/load-pinned-image
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run reconciliation
        # Reconciliation uses keyless prices and local embeddings; it never builds the model-backed graph.
        run: |
          docker run --rm \
            -v "$PWD/data:/app/data" \
            "ghcr.io/${{ github.repository }}:${{ steps.image.outputs.tag }}" \
            argus-reconcile --decisions-log data/decisions.jsonl

      - name: Compute status update
        id: status
        run: |
          json="$(jq -nc --arg t "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{last_reconcile: $t}')"
          echo "json=$json" >> "$GITHUB_OUTPUT"

      - name: Publish updated state
        uses: ./.github/actions/publish-argus-state
        with:
          status-update: ${{ steps.status.outputs.json }}
          commit-message: "Reconcile outcomes"
          github-token: ${{ secrets.GITHUB_TOKEN }}
