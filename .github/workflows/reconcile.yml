name: Daily reconciliation

# The other half of the decision -> outcome loop: resolves decisions past
# their horizon against live prices and writes outcomes back to cultural
# memory, so reliability weighting has real evidence to learn from. Runs
# once daily, well after US market close.

on:
  schedule:
    - cron: "30 22 * * 1-5" # 22:30 UTC — after the last hourly collector tick
  workflow_dispatch:

concurrency:
  group: argus-collector # shares the argus-data branch with collector.yml; never run both at once
  cancel-in-progress: false

permissions:
  contents: write
  packages: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    # Observed: under 1.5 min. 10 min covers a slow image pull or a larger
    # batch of matured decisions without leaving room for a hung run.
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Restore prior state
        uses: ./.github/actions/restore-argus-state

      - name: Check out pinned image tag
        uses: actions/checkout@v7
        continue-on-error: true # first-ever run: the argus-deploy branch doesn't exist yet
        with:
          ref: argus-deploy
          path: deploy

      - name: Read pinned image tag
        # See image.yml's "Pin scheduled jobs to this build" step: falls back
        # to :latest only if the argus-deploy branch has never been published
        # (e.g. before this repo's first build under issue #95).
        id: image
        run: |
          tag="$(cat deploy/image-tag.txt 2>/dev/null || echo latest)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run reconciliation
        # No API secrets are required here, audited: reconciliation only reads
        # live prices via yfinance (keyless — see argus/seams.py's
        # LiveMarketDataProvider) and stores outcomes through a local
        # sentence-transformer embedding model (argus/memory/cultural.py). It
        # never builds the graph, so none of GROQ_API_KEY, FRED_API_KEY, or
        # NEWSAPI_KEY — all consumed only at collection time, see
        # collector.yml's preflight — need to be plumbed into this container.
        run: |
          docker run --rm \
            -v "$PWD/data:/app/data" \
            "ghcr.io/${{ github.repository }}:${{ steps.image.outputs.tag }}" \
            argus-reconcile --decisions-log data/decisions.jsonl

      - name: Compute status update
        id: status
        run: |
          json="$(jq -nc --arg t "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{last_reconcile: $t}')"
          echo "json=$json" >> "$GITHUB_OUTPUT"

      - name: Publish updated state
        uses: ./.github/actions/publish-argus-state
        with:
          status-update: ${{ steps.status.outputs.json }}
          commit-message: "Reconcile outcomes"
          github-token: ${{ secrets.GITHUB_TOKEN }}
