name: Unattended collector

# Trigger candidate collection cycles; runtime market-hours checks and the persisted news budget control actual work.

on:
  schedule:
    # Approximate Eastern hours by month; March can be an hour early. See docs/operations.md.
    - cron: "5 13-21/2 * 3-10 1-5"
    - cron: "5 14-22/2 * 11,12,1,2 1-5"
  workflow_dispatch:

concurrency:
  group: argus-collector
  cancel-in-progress: false

permissions:
  contents: write
  packages: read

jobs:
  collect:
    runs-on: ubuntu-latest
    # Allow image pulls and slow market providers while bounding stalled collection cycles.
    timeout-minutes: 15
    steps:
      - name: Verify required secrets are present
        # Require Groq for usable allocations; missing market-provider keys degrade their evidence with a warning.
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::error::GROQ_API_KEY is unset; configure it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          [ -z "$FRED_API_KEY" ] && echo "::warning::FRED_API_KEY is unset; macro evidence will degrade."
          [ -z "$NEWSAPI_KEY" ] && echo "::warning::NEWSAPI_KEY is unset; news sentiment will be unavailable."
          exit 0

      - name: Check out repository
        id: checkout
        uses: actions/checkout@v7

      - name: Restore prior state
        uses: ./.github/actions/restore-argus-state

      - name: Load pinned image
        id: image
        uses: ./.github/actions/load-pinned-image
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run collection cycle
        # Remove stale cycle output before running; publish fresh diagnostics even when the cycle exits degraded.
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        run: |
          rm -f data/collector_result.json
          docker run --rm \
            -v "$PWD/data:/app/data" \
            -e GROQ_API_KEY -e FRED_API_KEY -e NEWSAPI_KEY \
            "ghcr.io/${{ github.repository }}:${{ steps.image.outputs.tag }}" \
            argus-collect

      - name: Compute status update
        id: status
        # Publish degraded-cycle details after checkout, but never overwrite state when preflight prevented checkout.
        if: always() && steps.checkout.outcome == 'success'
        run: |
          if [ -f data/collector_result.json ]; then
            json="$(jq -c --arg t "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{
              last_run: $t,
              last_reason: (.reason // "unknown"),
              last_outcome: (.outcome // "unknown"),
              last_decisions_logged: (.decisions_logged // 0),
              last_decisions_with_allocation: (.decisions_with_allocation // 0),
              last_degraded_inputs: (.degraded_inputs // {})
            }' data/collector_result.json)"
          else
            echo "::warning::collector_result.json absent after this cycle - nothing has ever been logged"
            json="$(jq -nc --arg t "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{last_run: $t, last_reason: "unknown", last_outcome: "unknown"}')"
          fi
          echo "json=$json" >> "$GITHUB_OUTPUT"

      - name: Publish updated state
        if: always() && steps.checkout.outcome == 'success'
        uses: ./.github/actions/publish-argus-state
        with:
          status-update: ${{ steps.status.outputs.json }}
          commit-message: "Update collected state"
          github-token: ${{ secrets.GITHUB_TOKEN }}
