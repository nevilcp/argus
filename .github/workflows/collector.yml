name: Unattended collector

# Runs the collection cycle (argus-collect, see scripts/collect_session.py)
# against the pre-built image from image.yml. Most ticks outside actual
# trading hours are a fast no-op — MFTDataPipeline's own market-hours check
# is what decides whether a given tick does anything, not this schedule.
#
# GitHub's cron is best-effort: it can drift under load or skip a tick
# outright, and scheduled workflows stop firing after 60 days with no
# repository activity (a push or manual run resets that clock).

on:
  schedule:
    # Every 2 hours, 13:05-21:05 UTC covers 09:00-17:00 ET across both EST
    # and EDT — 5 ticks/weekday (GOV-14), matching NewsAPI's free-tier
    # 100 request/day budget at 20 requests per 20-ticker sweep (see
    # README.md's stated 5-run/day ceiling)
    - cron: "5 13-21/2 * * 1-5"
  workflow_dispatch:

concurrency:
  group: argus-collector
  cancel-in-progress: false

permissions:
  contents: write
  packages: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Verify required secrets are present
        # GROQ_API_KEY is required: fundamental, sentiment, and portfolio are
        # all LLM agents, and every decision comes out with those fields (plus
        # risk and allocation) null without it — a run that starts without
        # this key cannot produce anything of value, so fail before checkout
        # or the docker pull rather than report a false green. FRED_API_KEY
        # and NEWSAPI_KEY only degrade the macro agent and sentiment's
        # catalyst detection respectively (see argus/config.py), so their
        # absence is a warning, not a failure.
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::error::GROQ_API_KEY secret is not set — fundamental, sentiment, and portfolio all need it, so this run cannot produce a decision. Configure it under Settings > Secrets and variables > Actions before the collector can run."
            exit 1
          fi
          [ -z "$FRED_API_KEY" ] && echo "::warning::FRED_API_KEY secret is not set — the macro agent will degrade to single-observation inference this run."
          [ -z "$NEWSAPI_KEY" ] && echo "::warning::NEWSAPI_KEY secret is not set — sentiment will run without news-based catalyst detection this run."
          exit 0

      - name: Check out repository
        id: checkout
        uses: actions/checkout@v4

      - name: Restore prior state
        uses: ./.github/actions/restore-argus-state

      - name: Check out pinned image tag
        uses: actions/checkout@v4
        continue-on-error: true # first-ever run: the argus-deploy branch doesn't exist yet
        with:
          ref: argus-deploy
          path: deploy

      - name: Read pinned image tag
        # See image.yml's "Pin scheduled jobs to this build" step: falls back
        # to :latest only if the argus-deploy branch has never been published
        # (e.g. before this repo's first build under issue #95).
        id: image
        run: |
          tag="$(cat deploy/image-tag.txt 2>/dev/null || echo latest)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run collection cycle
        # Exits non-zero (failing this step, and the job) when the cycle ran
        # but came back DEGRADED — decisions logged with no usable allocation,
        # see argus/orchestration/collector.py's CycleOutcome and
        # params.COLLECTOR.min_decisions_with_allocation. The steps below
        # still run via if: always() so a degraded cycle's detail reaches
        # status.json instead of being lost with the failed step.
        #
        # Removes the prior cycle's collector_result.json first: restore-state
        # brought it back along with the rest of data/, and without this an
        # unrelated failure here (e.g. GHCR login, image pull, a crash before
        # argus-collect writes its own result) would leave that stale file
        # behind for "Compute status update" to republish under a fresh
        # last_run, misreporting an infra outage as an ordinary past cycle.
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        run: |
          rm -f data/collector_result.json
          docker run --rm \
            -v "$PWD/data:/app/data" \
            -e GROQ_API_KEY -e FRED_API_KEY -e NEWSAPI_KEY \
            "ghcr.io/${{ github.repository }}:${{ steps.image.outputs.tag }}" \
            argus-collect

      - name: Compute status update
        id: status
        # always() so a DEGRADED "Run collection cycle" step (see above) doesn't
        # skip this — but gated on checkout having succeeded, so a preflight
        # failure (no secrets — see the first step) still skips straight past
        # this and Publish rather than pushing state for a run that never
        # touched data/.
        if: always() && steps.checkout.outcome == 'success'
        run: |
          if [ -f data/collector_result.json ]; then
            json="$(jq -c --arg t "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{
              last_run: $t,
              last_reason: (.reason // "unknown"),
              last_outcome: (.outcome // "unknown"),
              last_decisions_logged: (.decisions_logged // 0),
              last_decisions_with_allocation: (.decisions_with_allocation // 0),
              last_degraded_inputs: (.degraded_inputs // {})
            }' data/collector_result.json)"
          else
            echo "::warning::collector_result.json absent after this cycle — nothing has ever been logged"
            json="$(jq -nc --arg t "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{last_run: $t, last_reason: "unknown", last_outcome: "unknown"}')"
          fi
          echo "json=$json" >> "$GITHUB_OUTPUT"

      - name: Publish updated state
        if: always() && steps.checkout.outcome == 'success'
        uses: ./.github/actions/publish-argus-state
        with:
          status-update: ${{ steps.status.outputs.json }}
          commit-message: "Update collected state"
          github-token: ${{ secrets.GITHUB_TOKEN }}
