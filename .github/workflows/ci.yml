name: ARGUS v2 CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Integration Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package with dev extras
        run: |
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy argus/

      - name: Run test suite
        run: |
          python -m pytest tests/ -v --tb=short
        env:
          # FRED key provided for macro data fetching in tests
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # Groq/Gemini keys intentionally omitted — LLM agents are mocked or
          # fixture-backed in CI (see argus/seams.py, ADR 0007)
          GROQ_API_KEY: ""
          GOOGLE_AI_API_KEY: ""
