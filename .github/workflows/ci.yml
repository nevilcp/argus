name: ARGUS v2 CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Integration Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package with dev extras
        run: |
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy argus/

      - name: Run test suite
        run: |
          python -m pytest tests/ -v --tb=short
        env:
          # FRED key provided for macro data fetching in tests
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # Groq key intentionally omitted — LLM agents are mocked or
          # fixture-backed in CI (see argus/seams.py)
          GROQ_API_KEY: ""

  clean-install:
    name: Clean Install (pyproject.toml only, no pip cache)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # No `cache: "pip"` here on purpose (DEP-5): the `test` job's cache can
      # mask a dependency resolution that only works because a stale wheel is
      # already sitting in the cache. This job resolves from pyproject.toml
      # alone, the same way a fresh clone or a Docker build does.
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package with test extras
        run: |
          pip install -e ".[test]"

      - name: Run test suite
        run: |
          python -m pytest tests/ -v --tb=short
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GROQ_API_KEY: ""
