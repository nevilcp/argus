name: ARGUS v2 CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install package with dev extras
        run: |
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type-check (mypy)
        run: mypy argus/ api/ scripts/

  test:
    name: Integration Test Suite (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Allow slow dependency resolution without leaving hung checks unbounded.
    timeout-minutes: 15

    # Test the supported Python floor; keep the matrix available for future supported versions.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package with test extras
        run: |
          pip install -e ".[test]"

      - name: Run test suite
        run: |
          python -m pytest tests/ -v --tb=short
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # Keep model calls fixture-backed; CI must never call Groq.
          GROQ_API_KEY: ""

  clean-install:
    name: Clean Install (pyproject.toml only, no pip cache)
    runs-on: ubuntu-latest
    # Allow slow dependency resolution without leaving hung checks unbounded.
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Resolve dependencies without a pip cache to expose installs that only work with stale local wheels.
      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install package with test extras
        run: |
          pip install -e ".[test]"

      - name: Run test suite
        run: |
          python -m pytest tests/ -v --tb=short
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GROQ_API_KEY: ""
