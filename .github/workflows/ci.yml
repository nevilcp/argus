name: ARGUS v2 CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install package with dev extras
        run: |
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type-check (mypy)
        run: mypy argus/ api/ scripts/

  test:
    name: Integration Test Suite (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Observed: ~2-3.5 min per matrix leg. 15 min covers a slow PyPI mirror
    # without leaving room for a truly hung run.
    timeout-minutes: 15

    # pyproject.toml declares requires-python = ">=3.14", the same version the
    # shipped image (Dockerfile.api) runs, so a single leg covers the whole
    # supported range. Kept as a matrix so a future floor bump or an added
    # version is a one-line change.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package with test extras
        run: |
          pip install -e ".[test]"

      - name: Run test suite
        run: |
          python -m pytest tests/ -v --tb=short
        env:
          # FRED key provided for macro data fetching in tests
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # Groq key intentionally omitted — LLM agents are mocked or
          # fixture-backed in CI (see argus/seams.py)
          GROQ_API_KEY: ""

  clean-install:
    name: Clean Install (pyproject.toml only, no pip cache)
    runs-on: ubuntu-latest
    # Observed: ~2-3.5 min. 15 min covers an uncached resolve against a slow
    # PyPI mirror without leaving room for a truly hung run.
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # No `cache: "pip"` here on purpose (DEP-5): the `test` job's cache can
      # mask a dependency resolution that only works because a stale wheel is
      # already sitting in the cache. This job resolves from pyproject.toml
      # alone, the same way a fresh clone or a Docker build does.
      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install package with test extras
        run: |
          pip install -e ".[test]"

      - name: Run test suite
        run: |
          python -m pytest tests/ -v --tb=short
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GROQ_API_KEY: ""
