name: ARGUS v2 CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Integration Test Suite (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Observed: ~2-3.5 min per matrix leg. 15 min covers a slow PyPI mirror
    # without leaving room for a truly hung run.
    timeout-minutes: 15

    # pyproject.toml declares requires-python = ">=3.11", but only 3.11 was ever
    # exercised — so a 3.12-only failure would reach a developer running 3.12
    # locally before it ever reached CI. Both ends of the supported range now run.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package with dev extras
        run: |
          pip install -e ".[dev]"

      # Lint and type-check are version-independent; running them once keeps the
      # matrix from reporting the same finding twice
      - name: Lint (ruff)
        if: matrix.python-version == '3.11'
        run: ruff check .

      - name: Type-check (mypy)
        if: matrix.python-version == '3.11'
        run: mypy argus/

      - name: Run test suite
        run: |
          python -m pytest tests/ -v --tb=short
        env:
          # FRED key provided for macro data fetching in tests
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # Groq key intentionally omitted — LLM agents are mocked or
          # fixture-backed in CI (see argus/seams.py)
          GROQ_API_KEY: ""

  clean-install:
    name: Clean Install (pyproject.toml only, no pip cache)
    runs-on: ubuntu-latest
    # Observed: ~2-3.5 min. 15 min covers an uncached resolve against a slow
    # PyPI mirror without leaving room for a truly hung run.
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # No `cache: "pip"` here on purpose (DEP-5): the `test` job's cache can
      # mask a dependency resolution that only works because a stale wheel is
      # already sitting in the cache. This job resolves from pyproject.toml
      # alone, the same way a fresh clone or a Docker build does.
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install package with test extras
        run: |
          pip install -e ".[test]"

      - name: Run test suite
        run: |
          python -m pytest tests/ -v --tb=short
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GROQ_API_KEY: ""
