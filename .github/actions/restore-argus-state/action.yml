name: Restore ARGUS state
description: >
  Restores the persistent ARGUS_DATA_DIR tree from the argus-data branch as a
  single unit, so the set of files that comes back is whatever the
  application wrote last time, not a hardcoded list.

runs:
  using: composite
  steps:
    - name: Check out prior state
      uses: actions/checkout@v7
      continue-on-error: true # first-ever run: the argus-data branch doesn't exist yet
      with:
        ref: argus-data
        path: state

    - name: Seed the data directory from prior state
      shell: bash
      run: |
        mkdir -p data
        if [ -d state/data ]; then
          cp -r state/data/. ./data/
        elif [ -d state ] && [ -n "$(find state -mindepth 1 -maxdepth 1 ! -name .git ! -name status.json -print -quit)" ]; then
          # The argus-data branch is always laid out as data/ plus status.json.
          # Anything else means the layout is wrong, and carrying on would let
          # publish-argus-state overwrite the branch with an empty data/.
          echo "::error::argus-data has files but no data/ directory; refusing to continue so the branch is not overwritten with empty state"
          exit 1
        else
          echo "no prior state"
        fi
        # World-writable so the image's non-root `argus` user (uid 1000) can
        # write here regardless of the runner's own uid
        chmod -R a+rwX data
